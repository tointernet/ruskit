sonar.projectKey=tointernet_ruskit
sonar.organization=toi

# Displayed name and version in SonarQube/SonarCloud
sonar.projectName=ruskit
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file.
sonar.sources=.

# Rust-specific file extensions (optional, increases scan accuracy)
sonar.inclusions=**/*.rs

# Path(s) to the code coverage report(s)
sonar.coverageReportPaths=cobertura.xml

# Default source encoding for Rust projects
sonar.sourceEncoding=UTF-8

# Set main branch
sonar.branch.name=main

# License info
sonar.links.scm=https://github.com/tointernet/ruskit
sonar.links.website=https://github.com/tointernet/ruskit
sonar.links.issue=https://github.com/tointernet/ruskit/issues

# Optional: Set MIT license (informational, not used for analysis)
sonar.projectLicenses=MIT